services:
  paper:
    build: .
    command: ["--mode", "paper", "--strategy", "${PAPER_STRATEGY:-ema-1d}"]
    env_file:
      - path: .env
        required: false
    environment:
      PAPER_DB: ${PAPER_VOLUME_DB:-/state/paper.sqlite3}
    volumes:
      - paper-state:/state
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "live", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

volumes:
  paper-state:
